
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <rect width="800" height="1000" fill="#f3f0e5"/>

  <text x="400" y="55" text-anchor="middle"
    font-size="32" font-weight="bold" fill="#19382e">
    HAYTOR AUDIO WALK
  </text>
  <text x="400" y="92" text-anchor="middle"
    font-size="19" fill="#987344">
    6.3 miles · 10 km · 11 stopping points
  </text>

  <rect x="45" y="125" width="710" height="690"
    rx="20" fill="#e3ead9" stroke="#c4d1b9" stroke-width="3"/>

  <path d="M620 540 L500 500 L460 440 L380 320
    L260 220 L180 180 L160 240 L100 340
    L260 260 L360 240 L380 320 L460 560"
    fill="none" stroke="#987344" stroke-width="6"
    stroke-dasharray="12 10" stroke-linecap="round"/>

  <!-- Clapper Bridge -->
  <rect x="348" y="228" width="24" height="24"
    rx="4" fill="#668b9b" stroke="white" stroke-width="3"/>
  <text x="390" y="235" font-size="16"
    font-weight="bold" fill="#19382e">Clapper Bridge</text>
  <text x="390" y="255" font-size="14" fill="#526f7c">
    SX752 787
  </text>

  <!-- Numbered stopping points -->
  <g fill="#19382e" stroke="white" stroke-width="4">
    <circle cx="620" cy="540" r="19"/>
    <circle cx="500" cy="500" r="19"/>
    <circle cx="460" cy="440" r="19"/>
    <circle cx="380" cy="320" r="19"/>
    <circle cx="260" cy="220" r="19"/>
    <circle cx="180" cy="180" r="19"/>
    <circle cx="160" cy="240" r="19"/>
    <circle cx="100" cy="340" r="19"/>
    <circle cx="260" cy="260" r="19"/>
    <circle cx="400" cy="320" r="19"/>
    <circle cx="460" cy="560" r="19"/>
  </g>

  <g fill="white" font-size="17" text-anchor="middle"
    font-weight="bold">
    <text x="620" y="546">1</text>
    <text x="500" y="506">2</text>
    <text x="460" y="446">3</text>
    <text x="380" y="326">4</text>
    <text x="260" y="226">5</text>
    <text x="180" y="186">6</text>
    <text x="160" y="246">7</text>
    <text x="100" y="346">8</text>
    <text x="260" y="266">9</text>
    <text x="400" y="326">10</text>
    <text x="460" y="566">11</text>
  </g>

  

  <!-- North arrow -->
  <path d="M700 180 L700 130 L687 150 M700 130 L713 150"
    fill="none" stroke="#19382e" stroke-width="4"/>
  <text x="700" y="115" text-anchor="middle"
    font-size="19" font-weight="bold" fill="#19382e">N</text>

  <!-- Legend -->
  <rect x="65" y="680" width="670" height="105"
    rx="12" fill="#f8f6ef" stroke="#c4d1b9"/>
  <circle cx="100" cy="720" r="12" fill="#19382e"/>
  <text x="125" y="727" font-size="17" fill="#19382e">
    Numbered audio stopping point
  </text>
  <path d="M410 720 L475 720" stroke="#987344"
    stroke-width="5" stroke-dasharray="10 7"/>
  <text x="490" y="727" font-size="17" fill="#19382e">
    Indicative route
  </text>
  <rect x="88" y="747" width="22" height="18"
    rx="3" fill="#668b9b"/>
  <text x="125" y="763" font-size="17" fill="#19382e">
    Other landmark
  </text>

  <rect x="55" y="850" width="690" height="105"
    rx="14" fill="#19382e"/>
  <text x="400" y="884" text-anchor="middle"
    font-size="21" font-weight="bold" fill="white">
    Original illustrative route overview
  </text>
  <text x="400" y="915" text-anchor="middle"
    font-size="16" fill="white">
    Marker positions based on published grid references
  </text>
  <text x="400" y="940" text-anchor="middle"
    font-size="15" fill="white">
    Connecting line is approximate · Not for navigation
  </text>
</svg>
